# Two example review environments (one per merge request) for trying discovery out, plus a namespace
# without the review label whose Redis must not be offered. Not for production: fixed passwords.
apiVersion: v1
kind: Namespace
metadata:
  name: review-1
  labels:
    env: review
  annotations:
    gitlab.com/mr-title: Fix login
---
apiVersion: v1
kind: Namespace
metadata:
  name: review-2
  labels:
    env: review
  annotations:
    gitlab.com/mr-title: New export
---
apiVersion: v1
kind: Namespace
metadata:
  name: scratch
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: review-1
stringData:
  redis-password: review-1-password
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: review-2
stringData:
  redis-password: review-2-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: review-1
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ['--requirepass', '$(REDIS_PASSWORD)']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-auth, key: redis-password }
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: review-2
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ['--requirepass', '$(REDIS_PASSWORD)']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis-auth, key: redis-password }
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: review-1
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: review-2
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
---
# Matches the Service selector but its namespace lacks env=review: never offered.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: scratch
  labels:
    app.kubernetes.io/name: redis
spec:
  ports:
    - name: redis
      port: 6379
---
# Who may use which environment: the group team-a on review-1, the user carol on review-2.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: review-pod-reader
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-a
  namespace: review-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: review-pod-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carol
  namespace: review-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: review-pod-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oidc:carol
